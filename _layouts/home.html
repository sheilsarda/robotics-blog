---
layout: default
---

<section class="hero">
  <p>{{ site.description }}</p>
</section>

<h4>Posts</h4>
<ul>
  {% for post in site.posts %}
  <li><strong><a href="{{ post.url | relative_url }}">{{ post.title }}</a></strong>{% if post.description %} — {{ post.description }}{% endif %}</li>
  {% endfor %}
</ul>

{{ content }}
