<!doctype html>
<meta charset="utf-8">
<title>Six ways labs train a manipulation policy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one 720px figure, label column left, a shared 0–100% plot column right; dumbbells per paper, grouped by method. */
:root {
  --surface: #FAFAF9; --ink: #111827; --ink-muted: #374151; --ink-faint: #6B7280;
  --grid: #E5E7EB; --rule: #D1D5DB; --before: #A78BFA; --after: #6D28D9;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --label-w: 268px; --pad-l: 34px; --pad-r: 40px;
}
html, body { margin: 0; background: #fff; }
#figure { width: 720px; box-sizing: border-box; padding: 22px 24px 18px; background: var(--surface); color: var(--ink); font: 12px/1.35 var(--font); }
h1 { font-size: 17px; font-weight: 600; line-height: 1.25; margin: 0 0 10px; letter-spacing: -0.01em; }
.sub { color: var(--ink-muted); font-size: 12.5px; margin: 0 0 10px; }
.legend { display: flex; gap: 18px; align-items: center; color: var(--ink-muted); font-size: 11.5px; margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.b { background: var(--before); } .dot.a { background: var(--after); }
.grid { display: grid; grid-template-columns: var(--label-w) 1fr; column-gap: 10px; }
.axis, .cell { padding: 0 var(--pad-r) 0 var(--pad-l); min-width: 0; }
.axis { position: relative; height: 16px; font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.axis i { position: absolute; transform: translateX(-50%); font-style: normal; top: 0; }
.axis.top { border-bottom: 1px solid var(--rule); margin-bottom: 2px; }
.axis.bottom { border-top: 1px solid var(--rule); margin-top: 2px; padding-top: 3px; }
.axis-name { font-size: 10.5px; color: var(--ink-faint); align-self: end; padding-bottom: 2px; }
.group { grid-column: 1 / -1; padding: 14px 0 5px; }
.group:first-of-type { padding-top: 8px; }
.group b { font-weight: 600; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
.group em { font-style: normal; font-weight: 400; font-size: 10.5px; color: var(--ink-faint); border: 1px solid var(--grid); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
.label { padding: 0 0 0 4px; min-width: 0; display: flex; align-items: center; height: 22px; white-space: nowrap; overflow: visible; }
.label b { font-weight: 500; }
.label span { color: var(--ink-muted); margin-left: 5px; }
.cell { height: 22px; }
.plot { position: relative; height: 100%;
  background-image: linear-gradient(var(--grid), var(--grid)), linear-gradient(var(--grid), var(--grid)), linear-gradient(var(--grid), var(--grid)), linear-gradient(var(--grid), var(--grid)), linear-gradient(var(--grid), var(--grid));
  background-size: 1px 100%; background-repeat: no-repeat;
  background-position: 0 0, 25% 0, 50% 0, 75% 0, 100% 0; }
.bar { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--before); }
.pt { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.pt.b { background: var(--before); } .pt.a { background: var(--after); }
.v { position: absolute; top: 50%; transform: translateY(-50%); font-size: 10.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.v.b { text-align: right; } 
</style>
<div id="figure">
  <h1>Six ways labs train a manipulation policy</h1>
  <div class="legend"><span><i class="dot b"></i>baseline the paper starts from</span><span><i class="dot a"></i>with the method</span></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const groups = [
  { name: "Behavior cloning from real demonstrations", tag: "real robots",
    rows: [["Robot Utility Models", "5 tasks in unseen homes", null, 90], ["mimic-one", "16-DoF hand, out of distribution", null, 93.3]] },
  { name: "Behavior cloning from synthetic demonstrations", tag: "real robots",
    rows: [["Guava", "simulated demos only, Franka, 9 tasks", null, 90], ["FoldNet", "garment folding", null, 75]] },
  { name: "Reinforcement learning in simulation", tag: "sim",
    rows: [["SimpleVLA-RL", "LIBERO, one demo per task", 48.9, 96.9], ["πRL", "π0.5 on LIBERO", 77.1, 98.3], ["RIPT-VLA", "one demo, 15 iterations", 4, 97]] },
  { name: "Distilling a frontier model's rollouts into a smaller model", tag: "sim",
    rows: [["CaP-X", "CaP-RL, Cube Lift", 25, 80]] },
  { name: "Reinforcement learning on the real robot", tag: "real robots",
    rows: [["Real-Time EXPO-FT", "10 minutes of data", 42, 97], ["ConRFT", "8 tasks, 45 to 90 minutes online", null, 96.3], ["ENPIRE", "pin-box, zip-tie, tool use", null, 99]] },
  { name: "Generative models as data engines", tag: "real robots",
    rows: [["U0", "π0.5 out of distribution", 36.9, 63.2]] },
  { name: "Improving the skill library and prompt instead of the weights", tag: "real robots",
    rows: [["RPG", "YAM, 30 of 30 trials", null, 100], ["SimEX", "26 of 30 trials", null, 86.7]] },
];
const fmt = v => (Number.isInteger(v) ? String(v) : v.toFixed(1));
const axis = cls => `<div class="axis-name">${cls === 'top' ? 'success rate, %' : ''}</div><div class="axis ${cls}">${[0,25,50,75,100].map(t => `<i style="left:${t}%">${t}</i>`).join('')}</div>`;
let html = axis('top');
for (const g of groups) {
  html += `<div class="group"><b>${g.name}<em>${g.tag}</em></b></div>`;
  for (const [name, setting, b, a] of g.rows) {
    let marks = '';
    if (b !== null) marks += `<div class="bar" style="left:${b}%;width:${a - b}%"></div><div class="pt b" style="left:${b}%"></div><div class="v b" style="right:calc(${100 - b}% + 8px)">${fmt(b)}</div>`;
    marks += `<div class="pt a" style="left:${a}%"></div><div class="v a" style="left:calc(${a}% + 8px)">${fmt(a)}</div>`;
    html += `<div class="label"><b>${name}</b><span>${setting}</span></div><div class="cell"><div class="plot">${marks}</div></div>`;
  }
}
html += axis('bottom');
document.getElementById('grid').innerHTML = html;
</script>
